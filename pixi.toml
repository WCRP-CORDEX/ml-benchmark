# Pixi workspace for CORDEX ML-Bench.
#
#     pixi install                                     # create the environment
#     pixi run evaluate -c models/<MODEL>/config.yaml  # run evaluation/evaluate.py
#     pixi run lab                                     # start JupyterLab
#     pixi run docs                                    # preview the docs site

[workspace]
name = "ml-benchmark"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
numpy = ">=2.3.3"
xarray = ">=2025.9.0"
netcdf4 = ">=1.7.2"
cftime = ">=1.6.4"
pyyaml = ">=6.0.2"
requests = ">=2.32.5"
matplotlib = ">=3.10.6"
cartopy = ">=0.25.0"
pytorch = { version = ">=2.8.0", build = "cpu*" }
jupyterlab = ">=4.4.7"
notebook = ">=7.4.5"
ipykernel = ">=6.30.1"
ipywidgets = ">=8.1.7"
zensical = ">=0.0.73,<0.0.74"

[pypi-dependencies]
# Branch `feature/ml-benchmark` on GitHub (`main` does not have `ml-eval
# benchmark` yet); the exact commit is recorded in pixi.lock, and
# `pixi update ml-evaluation` pulls the latest one. To develop against a local
# clone instead, swap the two lines below and run `pixi install`.
ml-evaluation = { git = "https://github.com/c3s-cordex-ml/ml-evaluation.git", branch = "feature/ml-benchmark" }
# ml-evaluation = { path = "../ml-evaluation", editable = true }

[tasks]
# Check that all the predictions (NetCDF files) exist
check-predictions = "python submission/validate.py"
# Compute evaluation metrics
evaluate = "python evaluation/evaluate.py"
# Check that a summary JSON exists for all the experiments
check-evaluation = "python evaluation/validate.py"
# Launch Jupyter Lab
lab = "jupyter lab"
# Copy `images/` to the GitHub Pages
docs-images = "rm -rf docs/images && cp -r images docs/images"
# Preview the site locally
docs = { cmd = "zensical serve", depends-on = ["docs-images"] }
# Build the site into `site/`
docs-build = { cmd = "zensical build --clean", depends-on = ["docs-images"] }
