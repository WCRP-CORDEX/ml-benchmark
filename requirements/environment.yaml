name: ml-benchmark
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy>=2.3.3
  - xarray>=2025.9.0
  - netcdf4>=1.7.2
  - cftime>=1.6.4
  - pyyaml>=6.0.2
  - requests>=2.32.5
  - matplotlib>=3.10.6
  - cartopy>=0.25.0
  - pytorch[version='>=2.8.0',build='cpu*']
  - jupyterlab>=4.4.7
  - notebook>=7.4.5
  - ipykernel>=6.30.1
  - ipywidgets>=8.1.7
  - zensical>=0.0.73,<0.0.74
  - pip
  - pip:
      # branch feature/ml-benchmark: `main` does not have `ml-eval benchmark` yet
      - ml-evaluation @ git+https://github.com/c3s-cordex-ml/ml-evaluation.git@feature/ml-benchmark
